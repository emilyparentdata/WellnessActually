name: Update Episodes

on:
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run episode update script
        run: python .github/scripts/update_episodes.py

      - name: Commit and push if episodes were added
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.html
          git diff --staged --quiet && echo "No new episodes." || (git commit -m "Add new episode(s) from RSS feed" && git push)
